# Train the density counter C_ψ once, before Method B (spec §4.1).
# Code: countsampler/novel/components/counter.py, countsampler/training/counter_trainer.py
defaults: base.yaml

experiment:
  name: counter

counter:
  input_space: latent          # latent (preferred: reads x̂0 directly) | image (decode x̂0 with the VAE)
  image_size: 256              # image mode only
  latent_channels: 4
  colors: null                 # null -> data.colors
  shapes: null                 # null -> data.train_shapes + data.heldout_shapes
  density_sigma_frac: 0.025    # Gaussian σ as a fraction of the output side (1.6 px at 64x64)
  arch:
    base_channels: 64
    channel_mult: [1, 2, 4]
    out_activation: softplus
    head_bias_init: -6.0       # OPEN. Strongly negative because softplus(0) summed over the
                               # 64x64 density map is 2839 spurious objects per channel - but
                               # -10.0 does not train AT ALL. The gradient through softplus is
                               # sigmoid(bias), so at -10 it is 4.5e-5: the head starts in a dead
                               # zone, and because 15-17 of the 18 categories are absent in any
                               # image, predicting zero everywhere is a strong local optimum. A
                               # 30-epoch run sat at val/exact_present = 0.0000 and
                               # val/mae_present = 5.317 (the mean count of present categories,
                               # i.e. predicting nothing) from epoch 0 to epoch 29 without moving.
                               # -6.0 starts at 10.1 objects per channel against a true ~5, with
                               # 54x the gradient. See docs/experiment_log.md 2026-11-25.
  dataset:
    train_size: 20000
    val_size: 2000
    max_categories_per_image: 3
    max_total_objects: 20
    empty_prob: 0.05
    touching_prob: 0.3
    identical_prob: 0.3
    heldout_combo_fraction: 0.1   # held-out (category, count) combinations for validation
    radius_range: [0.045, 0.09]
    background: random_light
    cache_dir: data_cache/counter
    harvested: []              # extra latent caches from scripts/harvest_generator_samples.py
  image_aug: {prob: 0.5, contrast: [0.8, 1.2], blur_sigma_max: 2.0, noise_std: 0.1}   # before VAE encoding (latent mode)
  online_aug: {prob: 0.8, contrast: [0.8, 1.2], blur_sigma_max: 1.0, noise_std: 0.3}  # every step ("heavy augmentation")
  train:
    epochs: 30
    batch_size: 64
    lr: 3.0e-4
    weight_decay: 1.0e-4
    mse_scale: 100.0           # s: MSE(s·D, s·target), targets are tiny
    l1_weight: 1.0             # L1 between predicted and true per-channel counts. Raised from
                               # 0.1: the density MSE is dominated by the empty channels, so the
                               # term that actually measures COUNT error needs to carry weight.
    num_workers: 4
    log_every: 50
