# Method C: cross-attention peak separation with differentiable soft centres (spec §5).
# Code: countsampler/novel/losses/peak.py, countsampler/novel/methods/method_c.py
defaults: base.yaml

experiment:
  name: method_c

method:
  name: C
  # Eq. (22). OPEN: loss weights.
  weights: {act: 1.0, rep: 1.0, supp: 1.0, anc: 10.0, pri: 10.0, ord: 1.0}
  stages:
    - {start: 0, terms: [act, supp, anc, pri]}
    - {start: 2000, terms: [act, supp, rep, anc, pri]}
    - {start: 4000, terms: [act, supp, rep, anc, pri, ord]}
  loss_steps: all
  attention:
    # Set from the offline scan (2026-11-24, runs/precheck_ext + runs/precheck_owl): this layer is
    # the best on BOTH sources - synthetic r(peaks,n)=+0.64, generated/OWLv2 r=+0.51.
    cross_layers: [up_blocks.1.attentions.1.transformer_blocks.0.attn2]
    smoothing_sigma: 1.0       # scan: sigma=1.0 beats 0.0 decisively (0.0 fires ~72 peaks regardless of n)
    grid: null                 # null = the first layer's grid; or e.g. [32, 32] to resample
  peak:
    kmeans_iters: 3            # J
    # tau_q is in tokens^2 (peak.py: -d2/tau_q), so halving lengths for the 16x16 layer
    # means QUARTERING it. At 4.0 the assignment kernel is sqrt(tau_q/2)=1.41 tokens wide -
    # wider than the r_min=1.5 separation it must enforce, so soft k-means cannot hold two
    # centres apart and the collapsed and correct layouts differ by 0.6% of the loss.
    tau_q: 1.0                 # OPEN: assignment temperature (token units²)
    tau_p: 0.1                 # OPEN: soft-max temperature for a_k
    # The scan chose a 16x16 layer, so the token-unit radii are halved from their 32x32 values:
    # shape radius 0.045-0.09 of the image = 0.7-1.4 tokens at 16x16 (was 1.4-2.9 at 32x32).
    r_min: 1.5                 # OPEN: tokens (was 3.0 for a 32x32 layer)
    # Floor of 1.5: local maxima come from 3x3 max-pool, whose diagonal neighbour sits at
    # sqrt(2)=1.414 tokens. Below that a centre does not cover its own neighbourhood, so an
    # object's peak lands in the suppression set and L_supp pushes it down while L_act
    # pushes it up - directly opposed gradients on the same tokens.
    r_s: 1.5                   # OPEN: suppression radius, tokens (was 2.5 for a 32x32 layer)
    peak_min_value: 0.1
    supp_min_value: 0.0
    fps_min_value: 0.0
    eps: 1.0e-6
    diag_peak_threshold: 0.5   # diagnostic only: NMS peaks above this vs n (scan best)
