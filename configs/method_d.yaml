# Method D: differentiable connected-component count on the object cross-attention map.
# Code: countsampler/novel/losses/components.py, countsampler/novel/methods/method_d.py
#
# Method C reached every one of its own objectives over 6000 steps while producing a single object
# for every requested count, because all of its terms are invariant under merging two objects.
# L_cc is built on the Euler characteristic chi = V - E + F, which is not: merging lowers it by
# exactly one. Verified on planted Gaussians - chi equals the object count exactly for k = 1..10.
defaults: base.yaml

experiment:
  name: method_d

method:
  name: D
  weights: {cc: 1.0, bin: 1.0, area: 1.0, anc: 10.0, pri: 10.0, ord: 1.0}
  stages:
    # No staging of the count term: Method C spent its first 2000 steps with nothing requiring
    # count-dependence and learned a degenerate solution before ord could object.
    - {start: 0, terms: [cc, bin, area, anc, pri]}
    - {start: 3000, terms: [cc, bin, area, anc, pri, ord]}
  loss_steps: all
  attention:
    # A 32x32 layer, NOT the 16x16 one the pre-check chose. Measured directly on real
    # cross-attention maps of generated images: with countable scenes, chi tracks the requested
    # count at corr +0.989 here against +0.777 at 16x16. The pre-check scanned images generated
    # from the bare-noun-phrase template, which are edge-to-edge tiling, and on those no layer
    # carries count structure (corr +0.42 here) - so it was choosing between equally bad options.
    cross_layers: [up_blocks.2.attentions.0.transformer_blocks.0.attn2]
    smoothing_sigma: 1.0
    grid: null
  components:
    # Re-calibrated on REAL attention maps. The planted-Gaussian value (0.5) leaves 80 % of a
    # real map above threshold - one giant blob, chi = 1 whatever n is. Swept on real maps of
    # generated images, 0.70 at a 32x32 layer gives chi = 2.5, 4.3, 4.2, 5.4, 7.2, 9.2 for
    # n = 1, 2, 3, 4, 6, 8.
    tau_frac: 0.70             # OPEN: threshold as a fraction of the map's max
    temperature: 0.02          # OPEN: sigmoid width of the soft occupancy
    min_area: 3.0              # OPEN: tokens per component below which the area term bites
    hard_threshold: 0.5        # diagnostic only: the discrete chi logged beside the soft one
    eps: 1.0e-6
